  'prisma@6.19.3': true
  'esbuild@0.28.2': true
  '@embedded-postgres/linux-x64@18.4.0-beta.17': true

overrides:
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  sharp: ^0.35.5
  deepmerge-ts: ^8.0.0
